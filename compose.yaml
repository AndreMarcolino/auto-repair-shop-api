services:
  postgres:
    image: postgres:17
    container_name: auto-repair-shop-postgres
    environment:
      POSTGRES_DB: auto_repair_shop
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d auto_repair_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: