spring:
  application:
    name: auto-repair-shop-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auto_repair_shop}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false