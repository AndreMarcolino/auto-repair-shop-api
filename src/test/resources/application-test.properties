# Perfil "test": usado pelos testes de integração (@ActiveProfiles("test")).
#
# O banco é um PostgreSQL REAL, criado em um container Docker pelo Testcontainers
# (a URL "jdbc:tc:..." sobe o container automaticamente). Assim o teste roda contra o
# mesmo tipo de banco da aplicação, com as mesmas migrations Flyway.
# Pré-requisito: Docker em execução na máquina.
#
# TC_DAEMON=true mantém o container vivo até o fim da execução dos testes
# (todas as classes de teste compartilham o mesmo banco).
spring.datasource.url=jdbc:tc:postgresql:17:///auto_repair_shop?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

# Somente as migrations (sem db/seed): os testes criam os próprios dados pela API,
# então não dependem dos "dados fake" do profile local.
# Os dois funcionários de demonstração (atendente e mecânico) vêm da migration V17.
spring.flyway.locations=classpath:db/migration
